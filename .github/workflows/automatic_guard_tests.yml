name: Test automatic target-price guard
on:
  push:
    branches: [main]
    paths:
      - "src/pipeline.py"
      - "tests/test_automatic_guard.py"
      - "tests/test_pipeline.py"
      - ".github/workflows/automatic_guard_tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_automatic_guard.py tests/test_pipeline.py
