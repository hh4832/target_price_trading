name: Target price daily research
on:
  schedule:
    - cron: '0 0 * * 1-5' # 08:00 Asia/Taipei, UTC+8
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: target-price-daily
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run validated research pipeline
        env:
          FINLAB_REFRESH_TOKEN: ${{ secrets.FINLAB_REFRESH_TOKEN }}
          FINLAB_SESSION_ID: ${{ secrets.FINLAB_SESSION_ID }}
          FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.pipeline
