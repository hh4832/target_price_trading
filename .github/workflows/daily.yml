name: Target price daily research
on:
  repository_dispatch:
    types: [target-price-daily]
  schedule:
    - cron: '0 20 * * 0-4' # 04:00 Asia/Taipei (next calendar day), UTC+8
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: target-price-daily
  cancel-in-progress: false
jobs:
  external-dispatch-smoke:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.smoke_test == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm safe external dispatch
        run: |
          echo "PASS: target-price-daily repository_dispatch arrived."
          echo "client_payload.smoke_test=true; research pipeline is intentionally skipped."

  research:
    if: ${{ github.event_name != 'repository_dispatch' || github.event.client_payload.smoke_test != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run validated research pipeline
        env:
          FINLAB_REFRESH_TOKEN: ${{ secrets.FINLAB_REFRESH_TOKEN }}
          FINLAB_SESSION_ID: ${{ secrets.FINLAB_SESSION_ID }}
          FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python -m src.pipeline
